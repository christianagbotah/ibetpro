name: One-time Active Partial Cashout Patch

on:
  push:
    branches:
      - work/active-partial-cashout-counts-20261005

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/active-partial-cashout-counts-20261005
      - name: Keep partial cashouts in active counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          user_stats = Path('src/app/api/stats/user/route.ts')
          text = user_stats.read_text()
          old = 'where: { userId: user.id, accumulatorId: null, status: "pending" },'
          new = 'where: {\n          userId: user.id,\n          accumulatorId: null,\n          status: { in: ["pending", "partial_cashout"] },\n        },'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = 'where: { userId: user.id, status: "pending" },'
          new = 'where: {\n          userId: user.id,\n          status: { in: ["pending", "partial_cashout"] },\n        },'
          assert text.count(old) == 1, text.count(old)
          user_stats.write_text(text.replace(old, new))

          admin_stats = Path('src/app/api/stats/route.ts')
          text = admin_stats.read_text()
          old = 'where: { accumulatorId: null, status: "pending" },'
          new = 'where: {\n          accumulatorId: null,\n          status: { in: ["pending", "partial_cashout"] },\n        },'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = 'prisma.accumulator.count({ where: { status: "pending" } }),' 
          new = 'prisma.accumulator.count({\n        where: { status: { in: ["pending", "partial_cashout"] } },\n      }),' 
          assert text.count(old) == 1, text.count(old)
          admin_stats.write_text(text.replace(old, new))

          active = Path('src/components/dashboard/active-bets.tsx')
          text = active.read_text()
          old = '  const pendingBets = bets.filter((b) => b.status === "pending");'
          new = '  const pendingBets = bets.filter((b) =>\n    ["pending", "partial_cashout"].includes(b.status)\n  );'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = '                  {bet.status}\n'
          new = '                  {bet.status === "partial_cashout" ? "Partial Cashout" : bet.status}\n'
          assert text.count(old) == 1, text.count(old)
          active.write_text(text.replace(old, new))
          PY
          rm .github/workflows/one-time-active-partial-cashout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/stats/user/route.ts src/app/api/stats/route.ts src/components/dashboard/active-bets.tsx .github/workflows/one-time-active-partial-cashout.yml
          git commit -m "Keep partial cashouts in active bet reporting"
          git push origin HEAD:work/active-partial-cashout-counts-20261005
