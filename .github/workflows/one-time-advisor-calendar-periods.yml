name: One-time Advisor Calendar Period Patch

on:
  push:
    branches:
      - work/advisor-calendar-periods-20261005

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/advisor-calendar-periods-20261005
      - name: Align Advisor calendar periods
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/bot-engine-legacy.ts')
          text = path.read_text()

          old = 'import { syncOpenExposureForAccount } from "./allocation-exposure";'
          new = old + '\nimport { sumTicketStake } from "./bet-accounting";\nimport {\n  getRiskPeriodPnl,\n  getRiskPeriodStarts,\n} from "./risk-period-pnl";'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '      const user = await prisma.user.findUnique({ where: { id: userId } });'
          new = '      const [user, periodPnl] = await Promise.all([\n        prisma.user.findUnique({ where: { id: userId } }),\n        getRiskPeriodPnl(userId, settings.timezone),\n      ]);'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '      const riskCheck = checkRiskLimits(user?.dailyPnl || 0, user?.weeklyPnl || 0, {'
          new = '      const riskCheck = checkRiskLimits(periodPnl.dailyPnl, periodPnl.weeklyPnl, {'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '        const reason = (user?.dailyPnl ?? 0) <= -settings.stopLossDaily ? "stop_loss" : "profit_target";'
          new = '        const stopLossHit =\n          periodPnl.dailyPnl <= -settings.stopLossDaily ||\n          periodPnl.weeklyPnl <= -settings.stopLossWeekly;\n        const reason = stopLossHit ? "stop_loss" : "profit_target";'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '        const todayStart = new Date();'
          new = '        const { dayStart: todayStart } = getRiskPeriodStarts(settings.timezone);'
          assert text.count(old) == 2, text.count(old)
          text = text.replace(old, new)

          old = '        todayStart.setHours(0, 0, 0, 0);\n'
          assert text.count(old) == 2, text.count(old)
          text = text.replace(old, '')

          old = '        const dailyStake = todayBets.reduce((sum, b) => sum + b.stake, 0);'
          new = '        const dailyStake = sumTicketStake(todayBets);'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          path.write_text(text)
          PY
          rm .github/workflows/one-time-advisor-calendar-periods.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bot-engine-legacy.ts .github/workflows/one-time-advisor-calendar-periods.yml
          git commit -m "Use authoritative calendar periods in Advisor mode"
          git push origin HEAD:work/advisor-calendar-periods-20261005
