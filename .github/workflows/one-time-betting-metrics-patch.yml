name: One-time Betting Metrics Patch

on:
  push:
    branches:
      - work/betting-ticket-summary-20261004

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated Betting page patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/app/betting/page.tsx")
          s = p.read_text()

          replacements = [
              (
                  '''  const { data: pnlData } = usePolling<{ dailyPnl: number; weeklyPnl: number }>(\n    "/api/stats/user",\n    15000,\n    { dailyPnl: 0, weeklyPnl: 0 }\n  );\n''',
                  '''  const { data: pnlData } = usePolling<{\n    dailyPnl: number;\n    weeklyPnl: number;\n    totalBets: number;\n    totalProfit: number;\n    totalLoss: number;\n    totalStaked: number;\n    autoBets: number;\n    accumulatorBets: number;\n    todayStaked: number;\n  }>("/api/stats/user", 15000, {\n    dailyPnl: 0,\n    weeklyPnl: 0,\n    totalBets: 0,\n    totalProfit: 0,\n    totalLoss: 0,\n    totalStaked: 0,\n    autoBets: 0,\n    accumulatorBets: 0,\n    todayStaked: 0,\n  });\n''',
              ),
              (
                  '''  const autoBets = enrichedBets.filter((b) => b.isAutoPlaced);\n  const accumulatorBets = enrichedBets.filter((b) => b.accumulatorId);\n  const totalStake = enrichedBets.reduce((sum, b) => sum + b.stake, 0);\n  const totalProfit = enrichedBets.reduce((sum, b) => sum + (b.profit || 0), 0);\n''',
                  '''  const totalStake = pnlData.totalStaked;\n  const totalProfit = pnlData.totalProfit - pnlData.totalLoss;\n''',
              ),
              (
                  '''  // Daily bet limit progress\n  const todayBets = enrichedBets.filter((b) => {\n    const today = new Date();\n    const placedAt = new Date(b.placedAt);\n    return placedAt.toDateString() === today.toDateString();\n  });\n  const dailyStake = todayBets.reduce((sum, b) => sum + b.stake, 0);\n''',
                  '''  // Daily bet limit progress uses the same user-timezone boundary and\n  // ticket-level stake accounting as the backend execution gate.\n  const dailyStake = pnlData.todayStaked;\n''',
              ),
              (
                  '<p className="text-lg font-bold text-foreground">{enrichedBets.length}</p>',
                  '<p className="text-lg font-bold text-foreground">{pnlData.totalBets}</p>',
              ),
              (
                  '<p className="text-lg font-bold text-primary">{autoBets.length}</p>',
                  '<p className="text-lg font-bold text-primary">{pnlData.autoBets}</p>',
              ),
              (
                  '<p className="text-lg font-bold text-purple-400">{accumulatorBets.length}</p>',
                  '<p className="text-lg font-bold text-purple-400">{pnlData.accumulatorBets}</p>',
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one replacement, found {count}: {old[:80]!r}")
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          rm .github/workflows/one-time-betting-metrics-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/betting/page.tsx .github/workflows/one-time-betting-metrics-patch.yml
          git commit -m "Make Betting summary cards ticket-aware"
          git push origin HEAD:work/betting-ticket-summary-20261004
