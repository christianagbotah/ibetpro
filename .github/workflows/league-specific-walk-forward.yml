name: iBetPro League-Specific Walk Forward

on:
  workflow_dispatch:
  push:
    branches:
      - revamp/production-foundation
    paths:
      - .github/workflows/league-specific-walk-forward.yml

permissions:
  contents: read

concurrency:
  group: ibetpro-league-specific-walk-forward
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ml-service
    env:
      MODEL_TRAIN_N_JOBS: "2"
      EXPERIMENT_REVISION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Validate ML suite
        run: pytest -q

      - name: Collect public historical corpus
        run: |
          python -m training.collect_football_data             --leagues E0 SP1             --start-years 2019 2020 2021 2022 2023 2024 2025             --output-dir data/league-specific/corpus

      - name: Build causal core-stats features
        run: |
          python -m training.build_features             --input data/league-specific/corpus/football-data-core.csv             --output data/league-specific/features.csv

      - name: Validate core-stats coverage
        run: |
          python -m training.validate_core_stats_readiness             --dataset data/league-specific/features.csv             --min-coverage 0.90             --start 2021-07-01             --end 2025-06-30             --output data/league-specific/readiness.json

      - name: Premier League walk forward
        run: |
          python -m training.walk_forward             --dataset data/league-specific/features.csv             --output data/league-specific/premier-league             --feature-profile core_stats             --league "Premier League"

      - name: La Liga walk forward
        run: |
          python -m training.walk_forward             --dataset data/league-specific/features.csv             --output data/league-specific/la-liga             --feature-profile core_stats             --league "La Liga"

      - name: Publish league evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("# iBetPro League-Specific Walk-Forward")
          print()
          print("| League | Folds beating market | Significant folds | Mean LL delta | Selective folds | Mean selective rate |")
          print("| --- | ---: | ---: | ---: | ---: | ---: |")

          for label, path in [
              ("Premier League", Path("data/league-specific/premier-league/walk-forward.json")),
              ("La Liga", Path("data/league-specific/la-liga/walk-forward.json")),
          ]:
              if not path.exists():
                  print(f"| {label} | — | — | — | — | — |")
                  continue
              data = json.loads(path.read_text())
              stability = data["stability"]
              selective = data.get("selective_stability") or {}
              print(
                  f"| {label} | "
                  f"{stability['folds_beating_market']}/{stability['fold_count']} | "
                  f"{stability['folds_significantly_beating_market']}/{stability['fold_count']} | "
                  f"{stability['mean_candidate_minus_market_log_loss']:.6f} | "
                  f"{selective.get('folds_with_candidate_rows', 0)}/{stability['fold_count']} | "
                  f"{selective.get('mean_candidate_rate', 0.0):.1%} |"
              )

              print()
              print(f"## {label}")
              print()
              print("| Fold | Candidate LL | Market LL | Delta | Candidate rate | Enabled bands |")
              print("| --- | ---: | ---: | ---: | ---: | ---: |")
              for fold in data["folds"]:
                  market = fold.get("market_comparison") or {}
                  sel = fold.get("selective") or {}
                  policy = sel.get("policy") or {}
                  print(
                      f"| {fold['name']} | "
                      f"{market.get('candidate_log_loss', float('nan')):.6f} | "
                      f"{market.get('benchmark_log_loss', float('nan')):.6f} | "
                      f"{market.get('delta', float('nan')):.6f} | "
                      f"{sel.get('candidate_rate', 0.0):.1%} | "
                      f"{policy.get('enabled_band_count', 0)} |"
                  )
              print()
          PY

      - name: Upload league-specific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibetpro-league-specific-walk-forward
          path: ml-service/data/league-specific/
          if-no-files-found: warn
          retention-days: 30
