name: One-time Monthly Stats Format Fix

on:
  push:
    branches:
      - work/timezone-monthly-stats-20261005

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/timezone-monthly-stats-20261005
      - name: Fix monthly stats formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/api/stats/user/route.ts')
          text = path.read_text()
          old = '''      const {
          start: monthStart,
          end: monthEnd,
          label: monthLabel,
          } = getCalendarMonthWindow(settings?.timezone, i, now);

          const [standaloneSettled, accumulatorSettled, monthCommission] ='''.replace('          ', '')
          new = '''      const {
            start: monthStart,
            end: monthEnd,
            label: monthLabel,
          } = getCalendarMonthWindow(settings?.timezone, i, now);

          const [standaloneSettled, accumulatorSettled, monthCommission] ='''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          # Build exact source strings explicitly to avoid YAML indentation effects.
          old = '      const {\n  start: monthStart,\n  end: monthEnd,\n  label: monthLabel,\n} = getCalendarMonthWindow(settings?.timezone, i, now);\n\nconst [standaloneSettled, accumulatorSettled, monthCommission] ='
          new = '      const {\n        start: monthStart,\n        end: monthEnd,\n        label: monthLabel,\n      } = getCalendarMonthWindow(settings?.timezone, i, now);\n\n      const [standaloneSettled, accumulatorSettled, monthCommission] ='
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/one-time-monthly-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/stats/user/route.ts .github/workflows/one-time-monthly-format-fix.yml
          git commit -m "Format timezone-aware monthly stats block"
          git push origin HEAD:work/timezone-monthly-stats-20261005
