name: One-time Monthly Realized PnL Format Fix

on:
  push:
    branches:
      - work/monthly-realized-pnl-events-20261005

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/monthly-realized-pnl-events-20261005
      - name: Format realized monthly PnL block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stats = Path('src/app/api/stats/user/route.ts')
          text = stats.read_text()
          old = '      const [realizedPnl, monthCommission] = await Promise.all([\n  getRealizedPnlBreakdown(user.id, monthStart, monthEnd),\n  prisma.transaction.aggregate({\n    where: {\n      userId: user.id,\n      type: "commission",\n      createdAt: { gte: monthStart, lt: monthEnd },\n    },\n    _sum: { amount: true },\n  }),\n]);\n\nconst profit = realizedPnl.profit;\nconst loss = realizedPnl.loss;'
          new = '      const [realizedPnl, monthCommission] = await Promise.all([\n        getRealizedPnlBreakdown(user.id, monthStart, monthEnd),\n        prisma.transaction.aggregate({\n          where: {\n            userId: user.id,\n            type: "commission",\n            createdAt: { gte: monthStart, lt: monthEnd },\n          },\n          _sum: { amount: true },\n        }),\n      ]);\n\n      const profit = realizedPnl.profit;\n      const loss = realizedPnl.loss;'
          assert text.count(old) == 1, text.count(old)
          stats.write_text(text.replace(old, new))

          risk = Path('src/lib/risk-period-pnl.ts')
          text = risk.read_text()
          text = text.replace('  return { timezone, start, end, label };\n}\n\n\nexport async function getRealizedPnlBreakdown(', '  return { timezone, start, end, label };\n}\n\nexport async function getRealizedPnlBreakdown(')
          risk.write_text(text)
          PY
          rm .github/workflows/one-time-monthly-realized-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/stats/user/route.ts src/lib/risk-period-pnl.ts .github/workflows/one-time-monthly-realized-format.yml
          git commit -m "Format realized monthly PnL reporting"
          git push origin HEAD:work/monthly-realized-pnl-events-20261005
