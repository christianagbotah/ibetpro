name: One-time Monthly Realized PnL Patch

on:
  push:
    branches:
      - work/monthly-realized-pnl-events-20261005

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/monthly-realized-pnl-events-20261005
      - name: Use realized events for monthly PnL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          risk = Path('src/lib/risk-period-pnl.ts')
          text = risk.read_text()
          marker = '\nexport async function getRiskPeriodPnl(\n'
          helper = '''
          export async function getRealizedPnlBreakdown(
            userId: string,
            start: Date,
            end?: Date
          ) {
            const createdAt = end ? { gte: start, lt: end } : { gte: start };
            const [profitResult, lossResult] = await Promise.all([
              prisma.botLog.aggregate({
                where: {
                  userId,
                  action: { in: REALIZED_PNL_ACTIONS },
                  profitImpact: { gt: 0 },
                  createdAt,
                },
                _sum: { profitImpact: true },
              }),
              prisma.botLog.aggregate({
                where: {
                  userId,
                  action: { in: REALIZED_PNL_ACTIONS },
                  profitImpact: { lt: 0 },
                  createdAt,
                },
                _sum: { profitImpact: true },
              }),
            ]);

            const profit = money(profitResult._sum.profitImpact || 0);
            const loss = money(Math.abs(lossResult._sum.profitImpact || 0));
            return { profit, loss, net: money(profit - loss) };
          }

          export async function getRiskPeriodPnl(
          '''.replace('          ', '')
          assert text.count(marker) == 1, text.count(marker)
          risk.write_text(text.replace(marker, '\n' + helper, 1))

          stats = Path('src/app/api/stats/user/route.ts')
          text = stats.read_text()
          old = 'import { getCalendarMonthWindow, getRiskPeriodPnl } from "@/lib/risk-period-pnl";'
          new = '''import {
            getCalendarMonthWindow,
            getRealizedPnlBreakdown,
            getRiskPeriodPnl,
          } from "@/lib/risk-period-pnl";'''.replace('          ', '')
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          start_marker = '      const [standaloneSettled, accumulatorSettled, monthCommission] =\n'
          end_marker = '      monthlyData.push({\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''      const [realizedPnl, monthCommission] = await Promise.all([
            getRealizedPnlBreakdown(user.id, monthStart, monthEnd),
            prisma.transaction.aggregate({
              where: {
                userId: user.id,
                type: "commission",
                createdAt: { gte: monthStart, lt: monthEnd },
              },
              _sum: { amount: true },
            }),
          ]);

          const profit = realizedPnl.profit;
          const loss = realizedPnl.loss;

          '''.replace('          ', '')
          text = text[:start] + replacement + text[end:]
          stats.write_text(text)
          PY
          rm .github/workflows/one-time-monthly-realized-pnl.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/risk-period-pnl.ts src/app/api/stats/user/route.ts .github/workflows/one-time-monthly-realized-pnl.yml
          git commit -m "Report monthly PnL from realized events"
          git push origin HEAD:work/monthly-realized-pnl-events-20261005
