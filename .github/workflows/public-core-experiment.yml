name: iBetPro Public Core Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - revamp/production-foundation
    paths:
      - .github/workflows/public-core-experiment.yml

permissions:
  contents: read

concurrency:
  group: ibetpro-public-core-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ml-service
    env:
      MODEL_TRAIN_N_JOBS: "2"
      EXPERIMENT_REVISION: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Validate ML suite
        run: pytest -q

      - name: Run public core experiment
        run: |
          python training/run_public_core_experiment.py             --work-dir data/public-core-run             --train-end 2023-06-30             --calibration-end 2024-06-30             --test-end 2025-06-30

      - name: Render evidence report
        if: always()
        run: |
          python training/render_experiment_report.py             --work-dir data/public-core-run             --output data/public-core-run/EXPERIMENT-REPORT.md || true

      - name: Publish experiment summary
        if: always()
        shell: bash
        run: |
          if [ -f data/public-core-run/EXPERIMENT-REPORT.md ]; then
            cat data/public-core-run/EXPERIMENT-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## iBetPro Public Core Experiment" >> "$GITHUB_STEP_SUMMARY"
            echo "No experiment report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibetpro-public-core-experiment
          path: ml-service/data/public-core-run/
          if-no-files-found: warn
          retention-days: 30
