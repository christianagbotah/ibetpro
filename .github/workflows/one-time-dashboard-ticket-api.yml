name: One-time Dashboard Ticket API Patch

on:
  push:
    branches: [work/dashboard-ticket-view-20261005]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dashboard-ticket-view-20261005
      - name: Add ticket-normalized bets view
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/bets/route.ts')
          text = p.read_text()
          old = '    const status = searchParams.get("status");\n\n    const where: Record<string, unknown> = { userId };'
          new = '''    const status = searchParams.get("status");
            const view = searchParams.get("view");

            if (view === "tickets") {
              const [standaloneBets, accumulators] = await Promise.all([
                prisma.bet.findMany({
                  where: {
                    userId,
                    accumulatorId: null,
                    ...(status ? { status } : {}),
                  },
                  include: { match: true, bettingAccount: true },
                }),
                prisma.accumulator.findMany({
                  where: { userId, ...(status ? { status } : {}) },
                }),
              ]);

              const accumulatorTickets = accumulators.map((a) => ({
                id: a.id,
                accumulatorId: a.id,
                betType: "accumulator",
                selection: "Combined ticket",
                odds: a.totalOdds,
                stake: a.stake,
                potentialWin: a.potentialWin,
                status: a.status,
                cashoutAmount: a.cashoutAmount,
                profit: a.profit,
                commission: a.commission,
                isAutoPlaced: a.isAutoPlaced,
                aiConfidence: null,
                aiReasoning: null,
                placedAt: a.placedAt,
                settledAt: a.settledAt,
                cashedOutAt: a.cashedOutAt,
                totalLegs: a.totalLegs,
                match: null,
                bettingAccount: null,
              }));

              const tickets = [...standaloneBets, ...accumulatorTickets].sort(
                (a, b) => new Date(b.placedAt).getTime() - new Date(a.placedAt).getTime()
              );
              return NextResponse.json(tickets);
            }

            const where: Record<string, unknown> = { userId };'''.replace('          ', '')
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/one-time-dashboard-ticket-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/bets/route.ts .github/workflows/one-time-dashboard-ticket-api.yml
          git commit -m "Add ticket-normalized bets view"
          git push origin HEAD:work/dashboard-ticket-view-20261005
