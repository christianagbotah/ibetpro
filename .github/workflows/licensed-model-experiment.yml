name: iBetPro Licensed Model Experiment

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Licensed fixture collection start (YYYY-MM-DD)"
        required: true
        default: "2019-07-01"
        type: string
      end_date:
        description: "Licensed fixture collection end (YYYY-MM-DD)"
        required: true
        default: "2025-06-30"
        type: string
      league_ids:
        description: "Sportmonks league IDs, space-separated"
        required: true
        default: ""
        type: string
      sport_key:
        description: "The Odds API sport key used for historical 1X2 snapshots"
        required: true
        default: "soccer_epl"
        type: string
      execute_historical_odds:
        description: "Actually spend paid historical Odds API quota"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ibetpro-licensed-model-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: ml-service
    env:
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      MODEL_TRAIN_N_JOBS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Validate ML suite before provider calls
        run: pytest -q

      - name: Require licensed provider credentials
        shell: bash
        run: |
          if [ -z "$SPORTMONKS_API_TOKEN" ]; then
            echo "::error::SPORTMONKS_API_TOKEN repository secret is required."
            exit 1
          fi
          if [ "${{ inputs.execute_historical_odds }}" = "true" ] && [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY repository secret is required when historical odds execution is enabled."
            exit 1
          fi

      - name: Collect licensed Sportmonks historical context
        shell: bash
        run: |
          read -r -a LEAGUES <<< "${{ inputs.league_ids }}"
          ARGS=(
            --start "${{ inputs.start_date }}"
            --end "${{ inputs.end_date }}"
            --out data/licensed/sportmonks
          )
          if [ "${#LEAGUES[@]}" -gt 0 ]; then
            ARGS+=(--league-ids "${LEAGUES[@]}")
          fi
          python -m training.collect_sportmonks "${ARGS[@]}"

      - name: Validate licensed walk-forward horizon before odds planning
        shell: bash
        run: |
          FIXTURES=$(find data/licensed/sportmonks -maxdepth 1 -name 'sportmonks-*.csv' | head -1)
          if [ -z "$FIXTURES" ]; then
            echo "::error::Sportmonks fixture corpus was not produced."
            exit 1
          fi
          python -m training.validate_walk_forward_horizon             --dataset "$FIXTURES"             --output data/licensed/walk-forward-horizon.json

      - name: Build historical-odds call plan
        shell: bash
        run: |
          FIXTURES=$(find data/licensed/sportmonks -maxdepth 1 -name 'sportmonks-*.csv' | head -1)
          if [ -z "$FIXTURES" ]; then
            echo "::error::Sportmonks fixture corpus was not produced."
            exit 1
          fi
          ARGS=(
            --fixtures "$FIXTURES"
            --sport-key "${{ inputs.sport_key }}"
            --out data/licensed/odds-history
          )
          if [ "${{ inputs.execute_historical_odds }}" = "true" ]; then
            ARGS+=(--execute)
          fi
          python -m training.collect_odds_api_history "${ARGS[@]}"

      - name: Publish quota plan
        if: always()
        shell: bash
        run: |
          PLAN=data/licensed/odds-history/historical-odds-plan.json
          if [ -f "$PLAN" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data=json.loads(Path("data/licensed/odds-history/historical-odds-plan.json").read_text())
          print("## Licensed historical odds plan")
          print()
          print(f"- Fixtures: **{data.get('fixtures', 0)}**")
          print(f"- Planned API calls: **{data.get('planned_api_calls', 0)}**")
          print(f"- Offsets: **{data.get('offsets_hours', [])} hours pre-kickoff**")
          print()
          print("Historical odds execution remains opt-in because it consumes paid quota.")
          PY
          fi

      - name: Stop after dry-run planning
        if: ${{ inputs.execute_historical_odds == false }}
        run: |
          echo "Dry-run completed. No paid historical odds calls were made."
          exit 0

      - name: Join licensed context and odds
        run: |
          python -m training.merge_corpus             --input-dir data/licensed             --output data/licensed/run/football.csv

      - name: Assess licensed corpus readiness
        if: ${{ inputs.execute_historical_odds == true }}
        run: |
          python -m training.data_readiness_gate             --quality data/licensed/run/corpus-quality.json             --output data/licensed/run/data-readiness.json

      - name: Build causal features
        if: ${{ inputs.execute_historical_odds == true }}
        run: |
          python -m training.build_features             --input data/licensed/run/football.csv             --output data/licensed/run/features.csv

      - name: Run licensed walk-forward
        if: ${{ inputs.execute_historical_odds == true }}
        run: |
          python -m training.walk_forward             --dataset data/licensed/run/features.csv             --output data/licensed/run/folds             --feature-profile enriched

      - name: Package cross-season-approved shadow candidate
        if: ${{ inputs.execute_historical_odds == true }}
        shell: bash
        run: |
          REPORT=data/licensed/run/folds/walk-forward.json
          MODEL=data/licensed/run/folds/2024-25
          if [ ! -f "$REPORT" ] || [ ! -f "$MODEL/metadata.json" ]; then
            echo "::error::Walk-forward report or final fold model is missing."
            exit 1
          fi

          ELIGIBLE=$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/licensed/run/folds/walk-forward.json").read_text())
          print("true" if (data.get("selective_stability") or {}).get("eligible_for_shadow") else "false")
          PY
          )

          if [ "$ELIGIBLE" != "true" ]; then
            echo "No cross-season-stable selective bands. Shadow package intentionally not created."
          else
            python -m training.package_shadow_candidate               --model-dir "$MODEL"               --walk-forward "$REPORT"               --output data/licensed/run/shadow-candidate
          fi

      - name: Publish selective stability
        if: always()
        shell: bash
        run: |
          REPORT=data/licensed/run/folds/walk-forward.json
          if [ -f "$REPORT" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data=json.loads(Path("data/licensed/run/folds/walk-forward.json").read_text())
          selective=data.get("selective_stability") or {}
          stability=data.get("stability") or {}
          print("## Licensed walk-forward evidence")
          print()
          print(f"- Folds beating market: **{stability.get('folds_beating_market', 0)}**")
          print(f"- Stable selective bands: **{selective.get('stable_band_count', 0)}**")
          print(f"- Eligible for shadow: **{selective.get('eligible_for_shadow', False)}**")
          PY
          fi

      - name: Upload licensed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibetpro-licensed-model-experiment
          path: ml-service/data/licensed/
          if-no-files-found: warn
          retention-days: 30
