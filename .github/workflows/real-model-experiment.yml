name: iBetPro Real Model Experiment

on:
  workflow_dispatch:
    inputs:
      include_detail:
        description: "Collect batched historical fixture statistics (required for enriched training)"
        required: true
        default: true
        type: boolean
      pause_seconds:
        description: "Pause between detailed fixture requests"
        required: true
        default: "0.35"
        type: string

permissions:
  contents: read

concurrency:
  group: ibetpro-real-model-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: ml-service
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Require API-Football secret
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::error::Repository secret API_FOOTBALL_KEY is required."
            exit 1
          fi

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Validate ML suite before spending provider quota
        run: pytest -q

      - name: Collect manifest corpus
        shell: bash
        run: |
          ARGS=(--manifest training/corpus-manifest.json --out data/historical --pause "${{ inputs.pause_seconds }}")
          if [ "${{ inputs.include_detail }}" = "true" ]; then
            ARGS+=(--include-detail)
          fi
          python training/collect_manifest.py "${ARGS[@]}"

      - name: Merge and assess enriched corpus
        shell: bash
        run: |
          mkdir -p data/run
          python training/merge_corpus.py \
            --input-dir data/historical \
            --output data/run/football.csv
          python training/data_readiness_gate.py \
            --quality data/run/corpus-quality.json \
            --output data/run/data-readiness.json

      - name: Run first experiment
        run: |
          python training/run_first_experiment.py \
            --raw-dir data/historical \
            --work-dir data/run \
            --train-end 2023-06-30 \
            --calibration-end 2024-06-30 \
            --test-end 2025-06-30

      - name: Build experiment report
        if: always()
        run: |
          python training/render_experiment_report.py             --work-dir data/run             --output data/run/EXPERIMENT-REPORT.md || true

      - name: Publish experiment summary
        if: always()
        shell: bash
        run: |
          if [ -f data/run/EXPERIMENT-REPORT.md ]; then
            cat data/run/EXPERIMENT-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## iBetPro Model Experiment" >> "$GITHUB_STEP_SUMMARY"
            echo "No experiment report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibetpro-first-real-experiment
          path: |
            ml-service/data/run/
            ml-service/data/historical/corpus-index.json
            ml-service/data/run/data-readiness.json
          if-no-files-found: warn
          retention-days: 30
