name: One-time Bot Log PnL Patch

on:
  push:
    branches:
      - work/bot-log-realized-pnl-20261004

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Separate placement exposure from realized PnL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # New placement audit logs are exposure events, not realized PnL.
          p = Path("src/lib/auto-bet-placement.ts")
          s = p.read_text()
          old = "profitImpact: -input.stake,"
          if s.count(old) != 2:
              raise SystemExit(f"Expected 2 placement profitImpact entries, found {s.count(old)}")
          s = s.replace(old, "profitImpact: 0,")
          p.write_text(s)

          # Bot-log summary uses user-local day and realized events only.
          p = Path("src/app/api/bot-logs/route.ts")
          s = p.read_text()
          replacements = [
              (
                  'import { requireAuth } from "@/lib/session";\n',
                  'import { requireAuth } from "@/lib/session";\nimport { getRiskPeriodStarts } from "@/lib/risk-period-pnl";\n',
              ),
              (
                  '''    // Get summary stats\n    const todayStart = new Date();\n    todayStart.setHours(0, 0, 0, 0);\n\n    const todayLogs = await prisma.botLog.findMany({\n      where: { userId, createdAt: { gte: todayStart } },\n    });\n\n    const summary = {\n''',
                  '''    // Get summary stats using the user's local calendar day.\n    const settings = await prisma.userSettings.findUnique({\n      where: { userId },\n      select: { timezone: true },\n    });\n    const { dayStart: todayStart } = getRiskPeriodStarts(settings?.timezone);\n\n    const todayLogs = await prisma.botLog.findMany({\n      where: { userId, createdAt: { gte: todayStart } },\n    });\n    const realizedPnlActions = new Set([\n      "bet_settled",\n      "accumulator_settled",\n      "cashout_executed",\n    ]);\n\n    const summary = {\n''',
              ),
              (
                  '      totalProfitImpact: todayLogs.reduce((sum, l) => sum + (l.profitImpact || 0), 0),\n',
                  '      totalProfitImpact: todayLogs\n        .filter((l) => realizedPnlActions.has(l.action))\n        .reduce((sum, l) => sum + (l.profitImpact || 0), 0),\n',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one bot-log replacement, found {s.count(old)}: {old[:80]!r}")
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Historical placement logs may still contain -stake; never render them as realized losses.
          p = Path("src/components/betting/bot-activity-feed.tsx")
          s = p.read_text()
          replacements = [
              (
                  '  accumulator_created: { icon: Layers, color: "text-purple-400", label: "Accumulator", bg: "bg-purple-400/10" },\n',
                  '  accumulator_created: { icon: Layers, color: "text-purple-400", label: "Accumulator", bg: "bg-purple-400/10" },\n  accumulator_settled: { icon: CheckCircle, color: "text-emerald-400", label: "Acca Settled", bg: "bg-emerald-400/10" },\n',
              ),
              (
                  '''                const config = actionConfig[log.action] || actionConfig.bet_skipped;\n                const Icon = config.icon;\n                const details = parseDetails(log.details);\n\n                return (\n''',
                  '''                const config = actionConfig[log.action] || actionConfig.bet_skipped;\n                const Icon = config.icon;\n                const details = parseDetails(log.details);\n                const isRealizedPnl = [\n                  "bet_settled",\n                  "accumulator_settled",\n                  "cashout_executed",\n                ].includes(log.action);\n\n                return (\n''',
              ),
              (
                  '                        {log.profitImpact !== null && log.profitImpact !== 0 && (\n',
                  '                        {isRealizedPnl && log.profitImpact !== null && log.profitImpact !== 0 && (\n',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one feed replacement, found {s.count(old)}: {old[:80]!r}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          rm .github/workflows/one-time-bot-log-pnl.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auto-bet-placement.ts src/app/api/bot-logs/route.ts src/components/betting/bot-activity-feed.tsx .github/workflows/one-time-bot-log-pnl.yml
          git commit -m "Separate bot exposure from realized PnL"
          git push origin HEAD:work/bot-log-realized-pnl-20261004
