# Webuzo custom domain override for ibetpro.lightworldtech.com
# Install as:
# /var/webuzo-data/nginx/custom/domains/ibetpro.lightworldtech.com.conf
#
# iBetPro intentionally uses port 3017. Port 3007 belongs to the
# Lightworld Technologies website on the shared VPS.

set $noindex @ibetpro_proxy;

location @ibetpro_proxy {
    proxy_pass http://127.0.0.1:3017;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
}

location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3017;
    add_header Cache-Control "public, immutable, max-age=31536000";
}

location / {
    proxy_pass http://127.0.0.1:3017;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
